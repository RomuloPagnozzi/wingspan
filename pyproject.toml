[project]
name = "wingspan"
version = "0.1.0"
description = "Wingspan board game engine with state machine architecture"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "httpx2>=2.13.1",
    "pytest>=9.0.2",
]
lab = [
    "openpyxl>=3.1.5",
    "optuna>=4.9.0",
    "pandas>=3.0.0",
    "pyarrow>=23.0.0",
    "tqdm>=4.67.3",
    "uuid6>=2025.0.1",
    "wingspan-rs",
]
train = [
    "torch>=2.15.0",
]
web = [
    "fastapi>=0.142.2",
    "pillow>=12.3.0",
    "pyjwt[crypto]>=2.15.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
wingspan = "wingspan.web.server:main"

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev", "lab", "web"]

[tool.uv.sources]
wingspan-rs = { path = "rust" }
