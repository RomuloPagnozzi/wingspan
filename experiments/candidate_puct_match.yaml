# PUCT with the candidate policy vs PUCT with the champion, same simulations (same net size: same time), on
# the deals of the other matches. Decides whether the candidate guides the next generation
# (docs/SELFPLAY_LOOP.md).
#   caffeinate -dis uv run python -m lab -c experiments/candidate_puct_match.yaml --record-decisions -o experiments/data/candidate_puct_match
mode: vs_reference
num_workers: 7
base: {strategy: mcts_rs, prior_min_visits: 4, exploration_constant: 0.5, simulations: 1380}
compare:
  reference_label: champion
  reference: {strategy: mcts_rs, policy: experiments/data/models/policy.bin, prior_min_visits: 4,
              exploration_constant: 0.5, simulations: 1380}
  values:
    - {label: candidate, overrides: {policy: experiments/data/models/policy_candidate.bin}}
seeds: {start: 90001, count: 300}
