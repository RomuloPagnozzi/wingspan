# EXP-011: paired flat Monte Carlo (common random numbers) vs the champion MCTS @1500.
# Stage 1 (48 positions, 2026-11-07): paired picks agree with a precise reference 71% vs 60% for
# unpaired; the champion behaves like unpaired flat MC. This checks whether that wins games.
# lean: same, with 300 playouts for lay_eggs (most placements end with the same score).
# Fresh seeds (2001+) so none overlap tuning or confirmation runs.
mode: vs_reference
num_workers: 7

seeds:
  count: 50
  start: 2001

base:
  strategy: flat_mc
  value_function: absolute_score

compare:
  reference_label: champion
  values:
    - label: paired
      overrides: {playouts: 1500, paired: true}
    - label: paired_lean_eggs
      overrides: {playouts: 1500, paired: true, phase_playouts: {lay_eggs: 300}}
