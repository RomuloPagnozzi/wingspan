# EXP-013: tree and flat variants vs the data generator (flat_mc_rs + phase table)
# Does a real tree (IS-MCTS) or more simulations beat the current self-play generator, now that search is
# fast? Every arm plays the reference on each deal from both seats; arms interleaved deal by deal.
# Runs until stopped; results anytime with: uv run python -m lab.summary experiments/data/tree_vs_flat
#   caffeinate -is uv run python -m lab -c experiments/tree_vs_flat.yaml --record-decisions -o experiments/data/tree_vs_flat
mode: vs_reference
num_workers: 7

# Shared specs (keys starting with x- are YAML anchors only; lab ignores them)
x-champion: &champion            # the mcts-v1 bot's tuned params (src/wingspan/ai/bots.yaml)
  strategy: mcts_rs
  determinize: true
  exploration_constant: 2.2709568546160086
  value_function: absolute_score
  widening_alpha: 0.8342441456576
  widening_k: 1.7011601880020222
x-generator: &generator          # experiments/selfplay_flat_mc.yaml
  strategy: flat_mc_rs
  value_function: absolute_score
  paired: true
  playouts: 1500
  phase_playouts: {select_initial_cards: 6000, activate_powers: 750, play_bird: 600, collect_food: 300,
                   lay_eggs: 300, pay_egg_cost: 300, select_food_to_discard: 300, select_egg_to_discard: 300,
                   end_turn: 300}

base: {}
compare:
  reference_label: generator
  reference: *generator
  values:
    - {label: tree_1500, overrides: {<<: *champion, simulations: 1500}}
    - {label: tree_10k, overrides: {<<: *champion, simulations: 10000}}
    - {label: tree_10k_c0.7, overrides: {<<: *champion, simulations: 10000, exploration_constant: 0.7}}
    - {label: flat_1500, overrides: {strategy: flat_mc_rs, value_function: absolute_score, paired: true, playouts: 1500}}
    - label: flat_x10
      overrides:
        <<: *generator
        playouts: 15000
        phase_playouts: {select_initial_cards: 60000, activate_powers: 7500, play_bird: 6000, collect_food: 3000,
                         lay_eggs: 3000, pay_egg_cost: 3000, select_food_to_discard: 3000,
                         select_egg_to_discard: 3000, end_turn: 3000}

seeds:
  start: clock                   # no count: until Ctrl+C; every run plays new deals, so restarting resumes
