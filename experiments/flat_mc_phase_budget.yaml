# EXP-012: paired flat Monte Carlo with a budget per phase vs the champion MCTS @1500.
# Run with --record-decisions: the games double as new training data (fresh deals, 3001+).
#
# Budgets are playouts per decision, split across the legal moves. Phases not listed use
# `playouts`. Set from a paired measurement on 204 positions (2026-11-07): the gap between the
# best and second-best move in final points, and the playouts per move needed to separate them.
mode: vs_reference
num_workers: 7

seeds:
  count: 50
  start: 3001

base:
  strategy: flat_mc
  value_function: absolute_score

compare:
  reference_label: champion
  values:
    - label: phase_budget
      overrides:
        playouts: 1500                # main_turn (41% of the time), draw_cards, pay_food_cost,
        paired: true                  # extra trades, discard_food: stakes worth the full budget
        phase_playouts:
          select_initial_cards: 6000  # 64 options got 23 playouts each; best vs worst hand: 10 pts
          activate_powers: 750        # needs ~290 per move, had 750 (19% of the time)
          play_bird: 600              # needs ~110 per move, had 600
          collect_food: 300           # the rest: best vs second move < 0.1 pt, so a wrong pick is
          lay_eggs: 300               # cheap, and separating them would take 5,000-12,000
          pay_egg_cost: 300           # playouts per move
          select_food_to_discard: 300
          select_egg_to_discard: 300
          end_turn: 300
