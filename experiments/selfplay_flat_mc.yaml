# Self-play training data: paired flat Monte Carlo with per-phase budgets in both seats,
# a new deal every game. On a rented server (lab/cloud.py) the agent makes the run endless from a
# fresh seed and sets num_workers; run it locally as is for a small test (14 games).
# Budgets as in EXP-012 (experiments/flat_mc_phase_budget.yaml), where they are explained.
mode: continuous
num_workers: 7
blue_share: 0.2  # 80/20 green/blue round-goal scoring, chosen by each game's seed

seeds:
  start: 100000
  count: 14

defaults:
  strategy: flat_mc
  value_function: absolute_score
  paired: true
  playouts: 1500
  phase_playouts:
    select_initial_cards: 6000
    activate_powers: 750
    play_bird: 600
    collect_food: 300
    lay_eggs: 300
    pay_egg_cost: 300
    select_food_to_discard: 300
    select_egg_to_discard: 300
    end_turn: 300

matchups:
  - - {label: seat_a}
    - {label: seat_b}
