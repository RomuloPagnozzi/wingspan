# flat_mc_rs vs flat_mc (Rust vs Python playouts, same config) @selfplay budgets
# The Rust port must not change strength: expect ~50% and a score difference around 0.
#   uv run python -m lab -c experiments/flat_mc_rs_vs_flat_mc.yaml --record-decisions -o experiments/data/rs_vs_py
mode: paired
num_workers: 7

base:                            # experiments/selfplay_flat_mc.yaml
  value_function: absolute_score
  paired: true
  playouts: 1500
  phase_playouts: {select_initial_cards: 6000, activate_powers: 750, play_bird: 600, collect_food: 300,
                   lay_eggs: 300, pay_egg_cost: 300, select_food_to_discard: 300, select_egg_to_discard: 300,
                   end_turn: 300}
compare:
  values:
    - {label: rust, overrides: {strategy: flat_mc_rs}}
    - {label: python, overrides: {strategy: flat_mc}}

seeds:
  start: 10000                   # no count: until Ctrl+C
