# EXP-014: tree scaling (3k/10k/30k sims) and the phase table for the tree, vs the data generator
# How does the champion tree's strength grow with simulations, and does flat MC's phase table (scaled to the
# tree) keep its strength at lower cost? Every arm plays the reference on each deal from both seats; arms
# interleaved deal by deal, so results are balanced whenever the run stops.
# Runs until stopped; results anytime with: uv run python -m lab.summary experiments/data/tree_scaling
#   caffeinate -is uv run python -m lab -c experiments/tree_scaling.yaml --record-decisions -o experiments/data/tree_scaling
mode: vs_reference
num_workers: 7

x-champion: &champion            # the mcts-v1 bot's tuned params (src/wingspan/ai/bots.yaml)
  strategy: mcts_rs
  determinize: true
  exploration_constant: 2.2709568546160086
  value_function: absolute_score
  widening_alpha: 0.8342441456576
  widening_k: 1.7011601880020222

base: {}
compare:
  reference_label: generator
  reference:                     # experiments/selfplay_flat_mc.yaml
    strategy: flat_mc_rs
    value_function: absolute_score
    paired: true
    playouts: 1500
    phase_playouts: {select_initial_cards: 6000, activate_powers: 750, play_bird: 600, collect_food: 300,
                     lay_eggs: 300, pay_egg_cost: 300, select_food_to_discard: 300, select_egg_to_discard: 300,
                     end_turn: 300}
  values:
    - {label: tree_3k, overrides: {<<: *champion, simulations: 3000}}
    - {label: tree_10k, overrides: {<<: *champion, simulations: 10000}}
    - {label: tree_30k, overrides: {<<: *champion, simulations: 30000}}
    # ~7 min per game; adds ~+0.5 points if the curve keeps halving per tripling (EXP-014)
    # - {label: tree_100k, overrides: {<<: *champion, simulations: 100000}}
    - label: tree_table_10k      # the generator's table ratios, scaled to 10k for the default
      overrides:
        <<: *champion
        simulations: 10000
        phase_simulations: {select_initial_cards: 40000, activate_powers: 5000, play_bird: 4000, collect_food: 2000,
                            lay_eggs: 2000, pay_egg_cost: 2000, select_food_to_discard: 2000,
                            select_egg_to_discard: 2000, end_turn: 2000}

seeds:
  start: clock                   # no count: until Ctrl+C; every run plays new deals, so restarting resumes
