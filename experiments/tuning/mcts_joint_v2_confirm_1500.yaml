# confirm mcts_joint_v2 top-3 + v1 champion round-robin, fresh seeds @1500 sims
# Arms are v2 trials 72, 63, 32 (top by win rate, seeds 1-20) plus the v1 champion (REFERENCE_PARAMS).
# Seeds start at 1001 so none overlap the tuning seeds (winner's curse).
mode: paired
num_workers: 7

seeds:
  count: 20
  start: 1001

base:
  strategy: mcts
  determinize: true
  simulations: 1500

compare:
  values:
    - label: v1_champion
      overrides: {exploration_constant: 2.27, value_function: absolute_score, widening_alpha: 0.83, widening_k: 1.7}
    - label: v2_t72
      overrides: {exploration_constant: 1.1354669047764545, value_function: score_delta, widening_alpha: 0.6303665309124046, widening_k: 1.412915005594185}
    - label: v2_t63
      overrides: {exploration_constant: 1.0377150883907837, value_function: score_delta, widening_alpha: 0.4757784290288546, widening_k: 0.7965316586019582}
    - label: v2_t32
      overrides: {exploration_constant: 0.9080213397790806, value_function: score_delta, widening_alpha: 0.42401165212889264, widening_k: 0.8130164075169062}
